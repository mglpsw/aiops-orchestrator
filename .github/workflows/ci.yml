name: aiops-ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # target-pack CURRENT view reads git blobs at an implementation_anchor SHA, which a shallow clone would not contain

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate shell scripts
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Validate actions catalog
        run: bash scripts/validate_actions_catalog.sh

      - name: Validate compose syntax
        run: |
          cp .env.example .env
          docker compose -p aiops-orchestrator -f deploy/docker-compose.yml config --quiet
          docker compose -p aiops-orchestrator \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.bluegreen.yml config --quiet
          rm -f .env

      - name: Run unit tests
        run: bash scripts/test.sh

      - name: Dangerous patterns grep
        run: |
          grep -RInE \
            'shell=True|create_subprocess_shell|docker exec|ssh |git push|git pull|docker compose up|docker compose down|docker compose restart|systemctl restart|systemctl start|systemctl stop|systemctl reload' \
            app docs tests config scripts README.md || true

  agent-review-release-gates:
    name: AgentReview release gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # target-pack CURRENT view reads git blobs at an implementation_anchor SHA, which a shallow clone would not contain

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Repository validation (ci_validate.sh)
        run: bash scripts/ci_validate.sh

      - name: AgentReview v2 schemas byte-identical
        run: python scripts/export-agent-review-v2-schemas.py --check

      - name: AgentReview v2 Lane 1 evals byte-identical
        run: python scripts/run-agent-review-v2-evals.py --check

      - name: CAEM 3.0 F0 pin valid
        run: python scripts/verify-caem-f0-pin.py --pin config/caem/caem-3.0-f0.pin.json --check

      - name: RI-B0a.2 reuse view in sync
        run: python scripts/generate-ri-b0a-2-reuse-view.py --check

      - name: Target-pack CURRENT view in sync
        run: python scripts/generate-target-pack-current-state.py --check

      - name: Benchmark corpus materializer byte-identical
        run: python scripts/materialize-benchmark-case.py --check

      - name: Benchmark corpus manifest byte-identical and minimums met
        run: python scripts/generate-benchmark-corpus-manifest.py --check

      - name: Benchmark premanifest byte-identical
        run: python scripts/generate-benchmark-premanifest.py --check

      - name: Benchmark final identity structurally complete and frozen fields intact
        run: python scripts/generate-benchmark-identity-final.py --check

      - name: Benchmark report deterministically reproducible from committed observations
        run: python scripts/generate-benchmark-report.py --check

      - name: Benchmark corpus safety gate (secrets/paths/identifiers)
        run: python scripts/validate-benchmark-corpus-safety.py
