name: Full offline regression
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  AIOPS_TEST_AUTO_MAX: "2"
jobs:
  regression:
    name: Full offline regression (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Full validation
        run: bash scripts/local_validate.sh
      - name: Preserve receipt and test reports, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-validation-${{ github.sha }}
          path: ${{ runner.temp }}/aiops-validation-*
          if-no-files-found: warn
