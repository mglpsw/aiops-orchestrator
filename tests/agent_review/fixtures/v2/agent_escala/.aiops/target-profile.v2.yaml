schema_id: agent-review.target-profile.v2
schema_version: 2
source: repo-profile
identity:
  repo: mglpsw/AgentEscala
  default_branch: master
artifacts:
  - artifact_id: full-diff
    path: artifacts/full.diff
    kind: diff
    required: true
    max_bytes: 1000000
budgets:
  max_chunks: 16
  total_prompt_chars: 250000
  max_chars_per_chunk: 24000
  max_files_per_chunk: 50
  max_contracts_per_chunk: 50
must_review:
  paths: []
  patterns:
    - "backend/**/*.py"
  artifact_ids: []
  minimum_coverage: complete
policies:
  network_policy: forbidden
  fail_closed: true
  redaction_required: true
  allow_partial_coverage: false
  required_checks:
    - pytest
  allowed_semantic_groups:
    - primary_backend_logic
    - tests
    - docs_changelog
  coverage_failure_state: blocked_pipeline
  model_uncertainty_state: manual_required
contracts:
  - contract_id: scheduling-rules
    contract_version: "1"
    path: contracts/domain-contracts.yaml
    sha256: c3c827f3440f5faef3524d9e287562013d6d85a9f8bd3413b15426fe9778c377
    scope: repository
    required: true
limitations: []
