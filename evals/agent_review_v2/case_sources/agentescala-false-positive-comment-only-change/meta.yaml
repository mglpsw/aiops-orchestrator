case_id: agentescala-false-positive-comment-only-change
target: agent_escala
family: semantic_safe_counterexample
expected_readiness: ready
safe_counterexample: true
rationale: >-
  Synthetic-only, new corpus extension (rev. 4.1 determination 1). A
  comment/docstring-only change inside a must_review path
  (backend/scheduling/*.py) must resolve to ready with zero findings --
  proves that merely touching a must_review file does not, by itself,
  generate a finding when the change carries no semantic content. This
  is a stronger counterexample than the historical test-file-only case,
  since it lives directly on a must_review pattern. Does not touch
  evals/agent_review_v2/cases/.
