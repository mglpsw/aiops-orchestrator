name: aiops-ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Fast repository integrity
        run: bash scripts/ci_validate.sh --repository

      - name: Focused validator and runner regression
        run: >-
          bash scripts/test.sh --serial
          tests/test_test_workers.py tests/test_ci_validation.py
          tests/test_action_catalog.py tests/test_executor_guardrails.py

      - name: Post-Ready guard regression when present on this subject
        run: |
          if [[ -f tests/test_post_ready_codex_guard.py ]]; then
            bash scripts/test.sh --serial tests/test_post_ready_codex_guard.py
          else
            echo '::notice::SkippedByScope: post-Ready guard is absent on master; qualification of this requested corpus remains pending (PR #370 owns it).'
          fi

  agent-review-release-gates:
    name: AgentReview release gates
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generated, contract and benchmark gates
        run: bash scripts/ci_validate.sh --generated
