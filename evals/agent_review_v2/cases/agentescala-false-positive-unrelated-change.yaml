# must never generate a finding or degrade readiness.
case_id: agentescala-false-positive-unrelated-change
category: false-positive
target: agent_escala
files:
  - path: tests/scheduling/test_shift_rules.py
    hunks:
      - {old_start: 1, old_lines: 3, new_start: 1, new_lines: 6, seed: unrelated-test-only-change}
expected_readiness: ready
